<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Sunrise over Emerald Forest Sky Gradient -->
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#05160e"/>
      <stop offset="42%" stop-color="#0f3320"/>
      <stop offset="75%" stop-color="#255840"/>
      <stop offset="93%" stop-color="#b58328"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <!-- Sun & Atmospheric Glow -->
    <radialGradient id="sunHalo" cx="50%" cy="66%" r="44%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.85"/>
      <stop offset="30%" stop-color="#fbbf24" stop-opacity="0.45"/>
      <stop offset="65%" stop-color="#22c55e" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#05160e" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="sunCore" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="50%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <linearGradient id="mist" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fde68a" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#0d2818" stop-opacity="0"/>
    </linearGradient>

    <filter id="textShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#030d07" flood-opacity="0.9"/>
    </filter>

    <clipPath id="bannerClip">
      <rect width="1200" height="360" rx="18"/>
    </clipPath>
    <clipPath id="ecFlag">
      <rect width="24" height="16" rx="3"/>
    </clipPath>
  </defs>

  <g clip-path="url(#bannerClip)">
    <!-- Sky Background -->
    <rect width="1200" height="360" fill="url(#sky)"/>
    <rect width="1200" height="360" fill="url(#sunHalo)"/>

    <!-- Rising Golden Sun (Positioned cleanly at the horizon below the text) -->
    <circle cx="600" cy="238" r="82" fill="#fde047" opacity="0.22">
      <animate attributeName="r" values="78;90;78" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="600" cy="238" r="56" fill="url(#sunCore)"/>

    <!-- Distant Sunlit Mountain Range (Layer 1) -->
    <path d="M -20 268 L 90 202 L 195 238 L 325 178 L 445 232 L 560 205 L 650 230 L 775 176 L 900 230 L 1035 182 L 1145 225 L 1220 195 L 1220 360 L -20 360 Z" fill="#1b4630" opacity="0.9"/>

    <!-- Mid-Distant Forest Ridge (Layer 2) -->
    <path d="M -20 284 L 65 242 L 160 270 L 285 218 L 410 268 L 520 242 L 680 245 L 815 212 L 945 262 L 1080 224 L 1220 260 L 1220 360 L -20 360 Z" fill="#133523"/>

    <!-- Golden Morning Mist in the Valley -->
    <rect x="0" y="226" width="1200" height="52" fill="url(#mist)"/>

    <!-- Dense Pine Forest Treeline (Layer 3) -->
    <path d="
      M 0 360 L 0 264
      L 18 238 L 32 264 L 48 230 L 64 262 L 82 240 L 98 268
      L 118 234 L 136 266 L 154 224 L 172 262 L 190 240 L 208 270
      L 228 244 L 246 272 L 266 232 L 284 266 L 304 242 L 322 274
      L 344 248 L 362 276 L 382 240 L 400 272 L 420 252 L 438 280
      L 460 258 L 478 282 L 498 262 L 516 286 L 538 268 L 558 288
      L 642 288 L 662 268 L 684 286 L 702 262 L 722 282 L 740 258
      L 762 280 L 780 252 L 800 272 L 818 240 L 838 276 L 856 248
      L 878 274 L 896 242 L 916 266 L 934 232 L 954 272 L 972 244
      L 992 270 L 1010 240 L 1028 262 L 1046 224 L 1064 266 L 1082 234
      L 1102 268 L 1118 240 L 1136 262 L 1152 230 L 1168 264 L 1182 238
      L 1200 264 L 1200 360 Z" fill="#0b2416"/>

    <!-- Foreground Dark Pine Forest Silhouette (Layer 4) -->
    <path d="
      M 0 360 L 0 284
      L 24 246 L 44 286 L 68 236 L 92 284 L 114 252 L 136 290
      L 162 244 L 186 288 L 210 256 L 232 294 L 258 262 L 280 296
      L 308 266 L 330 300 L 356 272 L 380 302 L 408 280 L 432 304
      L 460 286 L 486 308 L 520 294 L 555 310 L 600 304 L 645 310
      L 680 294 L 714 308 L 740 286 L 768 304 L 792 280 L 820 302
      L 844 272 L 870 300 L 892 266 L 920 296 L 942 262 L 968 294
      L 990 256 L 1014 288 L 1038 244 L 1064 290 L 1086 252 L 1108 284
      L 1132 236 L 1156 286 L 1176 246 L 1200 284 L 1200 360 Z" fill="#05130b"/>

    <!-- Birds Flying in Sky -->
    <g stroke="#061910" stroke-width="2.2" fill="none" stroke-linecap="round" opacity="0.75">
      <path d="M 445 168 Q 452 160 459 167 Q 466 160 473 168"/>
      <path d="M 485 154 Q 490 148 495 153 Q 500 148 505 154"/>
      <path d="M 720 162 Q 726 155 732 161 Q 738 155 744 162"/>
    </g>

    <!-- Title & Subtitle (High contrast in deep forest sky above the sun) -->
    <g filter="url(#textShadow)">
      <text x="600" y="96" fill="#fefce8" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Georgia, sans-serif" font-size="68" font-weight="900" text-anchor="middle" letter-spacing="7">STEIMBER</text>
      <rect x="210" y="114" width="780" height="36" rx="18" fill="#05160e" fill-opacity="0.65" stroke="#4ade80" stroke-width="1" stroke-opacity="0.35"/>
      <text x="600" y="137.5" fill="#ecfdf5" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif" font-size="16.5" font-weight="700" text-anchor="middle" letter-spacing="0.6">
        Co-Founder of Mineral Studio  ·  UTM Student  ·  Personal Projects
      </text>
    </g>

    <!-- Bottom Clean Pills -->
    <g transform="translate(105, 294)" font-family="'Segoe UI', -apple-system, sans-serif" font-size="13" font-weight="700">
      <g transform="translate(0, 0)">
        <rect width="240" height="40" rx="12" fill="#091910" fill-opacity="0.92" stroke="#d97706" stroke-width="1.5"/>
        <text x="120" y="25" fill="#fed7aa" text-anchor="middle">💎 Mineral Studio (Co-Founder)</text>
      </g>
      <g transform="translate(256, 0)">
        <rect width="235" height="40" rx="12" fill="#091910" fill-opacity="0.92" stroke="#22c55e" stroke-width="1.4"/>
        <text x="117.5" y="25" fill="#86efac" text-anchor="middle">🏛️ UTM Student (Coursework)</text>
      </g>
      <g transform="translate(507, 0)">
        <rect width="230" height="40" rx="12" fill="#091910" fill-opacity="0.92" stroke="#4ade80" stroke-width="1.4"/>
        <text x="115" y="25" fill="#bbf7d0" text-anchor="middle">💻 Personal Projects</text>
      </g>
      <g transform="translate(753, 0)">
        <rect width="235" height="40" rx="12" fill="#091910" fill-opacity="0.92" stroke="#eab308" stroke-width="1.4"/>
        <g transform="translate(26, 12)" clip-path="url(#ecFlag)">
          <rect x="0" y="0" width="24" height="8" fill="#FFD100"/>
          <rect x="0" y="8" width="24" height="4" fill="#0033A0"/>
          <rect x="0" y="12" width="24" height="4" fill="#EF3340"/>
          <circle cx="12" cy="8" r="2.2" fill="#d97706"/>
        </g>
        <text x="134" y="25" fill="#fef08a" text-anchor="middle">Manabí, Ecuador</text>
      </g>
    </g>
  </g>

  <rect width="1200" height="360" rx="18" fill="none" stroke="#1e462d" stroke-width="2"/>
</svg>
