<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 230" width="100%" height="100%">
  <defs>
    <!-- Antigravity Deep Slate & Primary Azure (#007acc) Animated Background -->
    <linearGradient id="agyBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b12">
        <animate attributeName="stop-color" values="#070b12;#0b1320;#05080d;#070b12" dur="16s" repeatCount="indefinite"/>
      </stop>
      <stop offset="52%" stop-color="#0f1b2d">
        <animate attributeName="stop-color" values="#0f1b2d;#142640;#0b1422;#0f1b2d" dur="16s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#122b4a">
        <animate attributeName="stop-color" values="#122b4a;#17375e;#0d2038;#122b4a" dur="16s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <!-- Antigravity White + Primary #007acc Radial Stage Aura -->
    <radialGradient id="agyStageAura" cx="82%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#007acc" stop-opacity="0.38">
        <animate attributeName="stop-opacity" values="0.24;0.44;0.24" dur="4.5s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#f9f9f9" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#070b12" stop-opacity="0"/>
    </radialGradient>

    <!-- Official Antigravity Logo Symbol (viewBox 0 0 180 180) -->
    <g id="agyOfficialMark">
      <path d="M144.248 149.062C151.748 154.688 162.998 150.938 152.685 140.625C121.748 110.625 128.31 28.125 89.8727 28.125C51.4352 28.125 57.9977 110.625 27.0602 140.625C15.8102 151.875 27.9977 154.688 35.4977 149.062C64.5602 129.375 62.6852 94.6875 89.8727 94.6875C117.06 94.6875 115.185 129.375 144.248 149.062Z"/>
    </g>

    <!-- Subtle Dot Matrix Pattern -->
    <pattern id="agyGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="0.85" fill="#38bdf8" fill-opacity="0.22"/>
    </pattern>

    <clipPath id="cardClip">
      <rect width="580" height="230" rx="16"/>
    </clipPath>
  </defs>

  <style>
    .phoneFloat {
      animation: floatPhone 4.6s ease-in-out infinite;
    }
    .pcNodeFloat {
      animation: floatPc 4.6s ease-in-out infinite -2.3s;
    }
    .streamDash {
      animation: flowStream 1.7s linear infinite;
    }
    .logoPulse {
      animation: logoFloat 3s ease-in-out infinite alternate;
    }

    @keyframes floatPhone {
      0%, 100% { transform: translateY(0px); }
      50%      { transform: translateY(-4.5px); }
    }
    @keyframes floatPc {
      0%, 100% { transform: translateY(0px); }
      50%      { transform: translateY(3.5px); }
    }
    @keyframes flowStream {
      0%   { stroke-dashoffset: 24; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes logoFloat {
      0%   { opacity: 0.88; }
      100% { opacity: 1; }
    }
  </style>

  <g clip-path="url(#cardClip)">
    <!-- Background Layers -->
    <rect width="580" height="230" fill="url(#agyBg)"/>
    <rect width="580" height="230" fill="url(#agyGrid)"/>
    <rect width="580" height="230" fill="url(#agyStageAura)"/>

    <!-- Top-Right Telemetry Badge -->
    <g transform="translate(378, 15)" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, monospace">
      <rect x="0" y="0" width="184" height="22" rx="11" fill="#f9f9f9" fill-opacity="0.96" stroke="#dfdfdf" stroke-width="1"/>
      <circle cx="13" cy="11" r="3.4" fill="#16a34a">
        <animate attributeName="opacity" values="1;0.35;1" dur="1.4s" repeatCount="indefinite"/>
      </circle>
      <g transform="translate(21, 4.5) scale(0.072)" fill="#101010">
        <use href="#agyOfficialMark"/>
      </g>
      <text x="108" y="14.5" fill="#101010" font-size="8.6" font-weight="800" text-anchor="middle" letter-spacing="0.4">ANTIGRAVITY · 90D LIVE</text>
    </g>

    <!-- Bottom Horizon Wave -->
    <path d="M 0 208 Q 145 194 295 206 T 580 196 L 580 230 L 0 230 Z" fill="#050911" opacity="0.94"/>
    <rect x="0" y="214" width="580" height="16" fill="#03050a"/>

    <!-- ==================== RIGHT STAGE: ANTIGRAVITY PC <-> WHITE MOBILE PWA ==================== -->
    <ellipse cx="480" cy="166" rx="80" ry="13" fill="#081322" stroke="#007acc" stroke-width="1.1" stroke-opacity="0.55"/>

    <!-- Antigravity Desktop PC Window (White Theme #F9F9F9 + Official Logo) -->
    <g class="pcNodeFloat" transform="translate(390, 82)">
      <rect x="0" y="0" width="50" height="38" rx="6" fill="#f9f9f9" stroke="#dfdfdf" stroke-width="1.3"/>
      <!-- Sidebar Strip (#efefef) -->
      <rect x="2" y="2" width="14" height="34" rx="4" fill="#efefef"/>
      <rect x="4" y="6" width="10" height="2.2" rx="1" fill="#848484"/>
      <rect x="4" y="11" width="9" height="2.2" rx="1" fill="#101010"/>
      <rect x="4" y="16" width="10" height="2.2" rx="1" fill="#848484"/>
      <!-- Official Antigravity Logo in PC Center -->
      <g transform="translate(23, 8) scale(0.11)" fill="#101010">
        <use href="#agyOfficialMark"/>
      </g>
      <!-- PC Stand -->
      <path d="M 18 38 L 32 38 L 35 43 L 15 43 Z" fill="#cbd5e1"/>
      <text x="25" y="53" fill="#bae6fd" font-family="monospace" font-size="7.2" font-weight="700" text-anchor="middle">AGY PC</text>
    </g>

    <!-- Bidirectional Encrypted Bridge Stream (#007acc + #16a34a) -->
    <path class="streamDash" d="M 442 98 C 458 88, 468 88, 480 98" fill="none" stroke="#38bdf8" stroke-width="1.8" stroke-dasharray="4 4"/>
    <path class="streamDash" d="M 480 112 C 468 120, 458 120, 442 112" fill="none" stroke="#4ade80" stroke-width="1.6" stroke-dasharray="4 4"/>

    <!-- Mobile Handset Running Literal Antigravity White UI (#F9F9F9) -->
    <g class="phoneFloat" transform="translate(480, 44)">
      <!-- Phone Frame -->
      <rect x="0" y="0" width="70" height="116" rx="13" fill="#101010" stroke="#dfdfdf" stroke-width="1.5"/>
      <!-- Antigravity Light Screen (#F9F9F9) -->
      <rect x="3.5" y="4.5" width="63" height="107" rx="10" fill="#f9f9f9"/>

      <!-- Top Bar Inside Phone: Antigravity Logo + Project Crumb + Green Online Dot -->
      <rect x="7" y="8" width="56" height="13" rx="5" fill="#efefef" stroke="#dfdfdf" stroke-width="0.7"/>
      <g transform="translate(10, 10) scale(0.05)" fill="#101010">
        <use href="#agyOfficialMark"/>
      </g>
      <rect x="22" y="12" width="24" height="2.6" rx="1.3" fill="#101010"/>
      <rect x="22" y="16" width="16" height="2" rx="1" fill="#848484"/>
      <circle cx="58" cy="14.5" r="2.2" fill="#16a34a">
        <animate attributeName="opacity" values="1;0.3;1" dur="1.4s" repeatCount="indefinite"/>
      </circle>

      <!-- User Message Card (#fbfbfb + #dfdfdf border) -->
      <rect x="9" y="25" width="52" height="17" rx="5" fill="#fbfbfb" stroke="#dfdfdf" stroke-width="0.9"/>
      <!-- Image Attachment Thumb + Prompt Line -->
      <rect x="12" y="28" width="10" height="11" rx="2.5" fill="#007acc" fill-opacity="0.2" stroke="#007acc" stroke-width="0.7"/>
      <rect x="25" y="30" width="31" height="2.6" rx="1.3" fill="#101010"/>
      <rect x="25" y="35" width="20" height="2.3" rx="1.1" fill="#7a7a7a"/>

      <!-- Assistant Response + Worked Trace + File Pill -->
      <rect x="9" y="46" width="28" height="6" rx="3" fill="#efefef"/>
      <rect x="12" y="48" width="22" height="2" rx="1" fill="#4a4a4a"/>

      <!-- Center Official Antigravity Watermark + Response Lines -->
      <g class="logoPulse" transform="translate(24, 55) scale(0.12)" fill="#101010" fill-opacity="0.14">
        <use href="#agyOfficialMark"/>
      </g>
      <rect x="9" y="56" width="48" height="2.8" rx="1.4" fill="#101010"/>
      <rect x="9" y="61.5" width="42" height="2.8" rx="1.4" fill="#101010"/>
      <rect x="9" y="67" width="34" height="2.6" rx="1.3" fill="#4a4a4a"/>

      <!-- File Pill (`lib/agy-bridge.js`) -->
      <rect x="9" y="73" width="36" height="8" rx="3" fill="#efefef" stroke="#dfdfdf" stroke-width="0.7"/>
      <rect x="12" y="76" width="30" height="2.2" rx="1" fill="#007acc"/>

      <!-- Stationary Bottom Composer Card (`#fbfbfb` + `+` button + Model pill + `#101010` Send circle) -->
      <rect x="7" y="86" width="56" height="21" rx="7" fill="#fbfbfb" stroke="#dfdfdf" stroke-width="0.9"/>
      <rect x="11" y="90" width="34" height="2.6" rx="1.3" fill="#848484"/>
      <!-- `+` Attach Photo/File icon -->
      <path d="M 12 101 L 16 101 M 14 99 L 14 103" stroke="#4a4a4a" stroke-width="1.2" stroke-linecap="round"/>
      <!-- Model Pill -->
      <rect x="20" y="98.5" width="22" height="5" rx="2.5" fill="#efefef"/>
      <!-- Dark #101010 Send Button -->
      <circle cx="56" cy="100.5" r="4.8" fill="#101010"/>
      <path d="M 56 102.8 L 56 98.4 M 54.1 100.1 L 56 98.2 L 57.9 100.1" fill="none" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- ==================== FOREGROUND CARD CONTENT (LEFT ALIGNED) ==================== -->
    <g transform="translate(28, 28)" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif">
      <!-- Top Capsule with Official Antigravity Logo -->
      <rect x="0" y="0" width="276" height="28" rx="14" fill="#f9f9f9" fill-opacity="0.95" stroke="#dfdfdf" stroke-width="1.2"/>
      <g transform="translate(11, 5) scale(0.1)" fill="#101010">
        <use href="#agyOfficialMark"/>
      </g>
      <text x="150" y="18.5" fill="#101010" font-size="10.4" font-weight="800" text-anchor="middle" letter-spacing="0.7">ANTIGRAVITY MOBILE · 90D PWA</text>

      <!-- Title -->
      <text x="0" y="62" fill="#f9f9f9" font-size="23" font-weight="800" letter-spacing="0.3">Steimber / agy-pocket</text>

      <!-- Description -->
      <text x="0" y="92" fill="#e2e8f0" font-size="13" opacity="0.96">1:1 mobile clone of Antigravity Desktop with 90-day session,</text>
      <text x="0" y="112" fill="#bae6fd" font-size="13" opacity="0.96">projects, sessions, photo/file uploads, and encrypted tunnel.</text>

      <!-- Bottom Translucent Capsules -->
      <g transform="translate(0, 138)" font-size="11.5" font-weight="600">
        <rect x="0" y="0" width="110" height="28" rx="14" fill="#f9f9f9" fill-opacity="0.94" stroke="#dfdfdf" stroke-width="1"/>
        <text x="55" y="18" fill="#101010" font-weight="700" text-anchor="middle">Antigravity UI</text>

        <rect x="118" y="0" width="112" height="28" rx="14" fill="#0c192c" fill-opacity="0.9" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.75"/>
        <text x="174" y="18" fill="#e0f2fe" text-anchor="middle">Photos &amp; Files</text>

        <rect x="238" y="0" width="114" height="28" rx="14" fill="#0c192c" fill-opacity="0.9" stroke="#4ade80" stroke-width="1" stroke-opacity="0.7"/>
        <text x="295" y="18" fill="#dcfce7" text-anchor="middle">AES-256 Tunnel</text>

        <rect x="394" y="0" width="130" height="28" rx="14" fill="#007acc" fill-opacity="0.95" stroke="#7dd3fc" stroke-width="1.2"/>
        <text x="459" y="18" fill="#ffffff" font-weight="700" text-anchor="middle">Open repo →</text>
      </g>
    </g>
  </g>

  <rect x="1" y="1" width="578" height="228" rx="16" fill="none" stroke="#38bdf8" stroke-width="1.6" stroke-opacity="0.68"/>
</svg>
