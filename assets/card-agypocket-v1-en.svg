<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 230" width="100%" height="100%">
  <defs>
    <!-- Antigravity Obsidian & Primary Azure (#007acc) Animated Stage Background -->
    <linearGradient id="agyBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a10">
        <animate attributeName="stop-color" values="#070a10;#0b111c;#05080d;#070a10" dur="16s" repeatCount="indefinite"/>
      </stop>
      <stop offset="55%" stop-color="#0e1726">
        <animate attributeName="stop-color" values="#0e1726;#132036;#0a111d;#0e1726" dur="16s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#132640">
        <animate attributeName="stop-color" values="#132640;#183254;#0d1b2e;#132640" dur="16s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <!-- Radial Stage Aura Around Antigravity Mobile + PC Bridge -->
    <radialGradient id="agyStageAura" cx="82%" cy="48%" r="52%">
      <stop offset="0%" stop-color="#007acc" stop-opacity="0.42">
        <animate attributeName="stop-opacity" values="0.26;0.46;0.26" dur="4.2s" repeatCount="indefinite"/>
      </stop>
      <stop offset="48%" stop-color="#f9f9f9" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#070a10" stop-opacity="0"/>
    </radialGradient>

    <!-- Official Antigravity Delta-Arch Mark (viewBox 0 0 180 180) -->
    <g id="agyOfficialMark">
      <path d="M144.248 149.062C151.748 154.688 162.998 150.938 152.685 140.625C121.748 110.625 128.31 28.125 89.8727 28.125C51.4352 28.125 57.9977 110.625 27.0602 140.625C15.8102 151.875 27.9977 154.688 35.4977 149.062C64.5602 129.375 62.6852 94.6875 89.8727 94.6875C117.06 94.6875 115.185 129.375 144.248 149.062Z"/>
    </g>

    <!-- Subtle Dot Grid -->
    <pattern id="agyGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="0.8" fill="#38bdf8" fill-opacity="0.2"/>
    </pattern>

    <clipPath id="cardClip">
      <rect width="580" height="230" rx="16"/>
    </clipPath>
  </defs>

  <style>
    .streamDash {
      animation: flowStream 1.6s linear infinite;
    }
    .hudPulse {
      animation: lockGlow 3.2s ease-in-out infinite;
    }

    @keyframes flowStream {
      0%   { stroke-dashoffset: 24; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes lockGlow {
      0%, 100% { opacity: 0.9; }
      50%      { opacity: 1; }
    }
  </style>

  <g clip-path="url(#cardClip)">
    <!-- Background Layers -->
    <rect width="580" height="230" fill="url(#agyBg)"/>
    <rect width="580" height="230" fill="url(#agyGrid)"/>
    <rect width="580" height="230" fill="url(#agyStageAura)"/>

    <!-- Expanding Telemetry Rings Behind Right Stage -->
    <g fill="none" stroke="#38bdf8">
      <circle cx="511" cy="98" r="46" stroke-width="1" opacity="0.28">
        <animate attributeName="r" values="42;72" dur="3.8s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.35;0" dur="3.8s" repeatCount="indefinite"/>
      </circle>
      <circle cx="511" cy="98" r="46" stroke-width="0.9" opacity="0.22" stroke="#63984f">
        <animate attributeName="r" values="42;76" dur="3.8s" begin="1.9s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.3;0" dur="3.8s" begin="1.9s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- Bottom Horizon Wave -->
    <path d="M 0 208 Q 145 194 295 206 T 580 196 L 580 230 L 0 230 Z" fill="#05080f" opacity="0.94"/>
    <rect x="0" y="214" width="580" height="16" fill="#03050a"/>

    <!-- ==================== RIGHT STAGE: ANTIGRAVITY PC <-> WHITE MOBILE PWA ==================== -->
    <ellipse cx="476" cy="166" rx="84" ry="12" fill="#07111f" stroke="#38bdf8" stroke-width="1.1" stroke-opacity="0.48"/>

    <!-- Antigravity Desktop PC Window (Pure SVG SMIL float) -->
    <g transform="translate(384, 78)">
      <g>
        <animateTransform attributeName="transform" type="translate" values="0,0; 0,3.5; 0,0" dur="4.6s" repeatCount="indefinite"/>
        <rect x="0" y="0" width="54" height="40" rx="6" fill="#f9f9f9" stroke="#dfdfdf" stroke-width="1.4"/>
        <!-- Sidebar Strip (#efefef) -->
        <rect x="2.5" y="2.5" width="15" height="35" rx="4" fill="#efefef"/>
        <rect x="4.5" y="6.5" width="11" height="2.2" rx="1" fill="#7a7a7a"/>
        <rect x="4.5" y="11.5" width="10" height="2.4" rx="1" fill="#101010"/>
        <rect x="4.5" y="16.5" width="11" height="2.2" rx="1" fill="#7a7a7a"/>
        <circle cx="15" cy="12.7" r="1.3" fill="#63984f"/>
        <!-- Official Antigravity Logo in PC Center -->
        <g transform="translate(26, 7) scale(0.105)" fill="#101010">
          <use href="#agyOfficialMark"/>
        </g>
        <!-- Crimson Inline Code Pill Inside PC -->
        <rect x="22" y="28" width="26" height="4.5" rx="2" fill="#efefef"/>
        <rect x="24" y="29.3" width="22" height="1.8" rx="0.9" fill="#a31515"/>
        <!-- PC Stand -->
        <path d="M 20 40 L 34 40 L 37 45 L 17 45 Z" fill="#cbd5e1"/>
        <text x="27" y="55" fill="#bae6fd" font-family="monospace" font-size="7.2" font-weight="700" text-anchor="middle">AGY PC</text>
      </g>
    </g>

    <!-- Bidirectional Encrypted Bridge Stream (#38bdf8 + #63984f) -->
    <path class="streamDash" d="M 440 94 C 454 84, 464 84, 476 94" fill="none" stroke="#38bdf8" stroke-width="1.8" stroke-dasharray="4 4"/>
    <path class="streamDash" d="M 476 108 C 464 118, 454 118, 440 108" fill="none" stroke="#63984f" stroke-width="1.7" stroke-dasharray="4 4"/>

    <!-- Mobile Handset Running Literal Antigravity White UI (Pure SVG SMIL float) -->
    <g transform="translate(476, 42)">
      <g>
        <animateTransform attributeName="transform" type="translate" values="0,0; 0,-4.5; 0,0" dur="4.6s" repeatCount="indefinite"/>
        <!-- Phone Bezel -->
        <rect x="0" y="0" width="72" height="118" rx="13" fill="#101010" stroke="#dfdfdf" stroke-width="1.5"/>
        <!-- Antigravity White Screen (#F9F9F9) -->
        <rect x="3.5" y="4" width="65" height="110" rx="10" fill="#f9f9f9"/>

        <!-- Top Header: Official Logo + Project Crumb + Spinning Status Circle -->
        <rect x="6.5" y="7.5" width="59" height="13.5" rx="5" fill="#efefef" stroke="#dfdfdf" stroke-width="0.7"/>
        <g transform="translate(9.5, 9.8) scale(0.05)" fill="#101010">
          <use href="#agyOfficialMark"/>
        </g>
        <rect x="21" y="11" width="26" height="2.6" rx="1.3" fill="#101010"/>
        <rect x="21" y="15.2" width="18" height="2" rx="1" fill="#7a7a7a"/>
        <!-- Spinning Running Circle -->
        <circle cx="59.5" cy="14.2" r="2.6" fill="none" stroke="#101010" stroke-width="1.2" stroke-dasharray="9 5">
          <animateTransform attributeName="transform" type="rotate" from="0 59.5 14.2" to="360 59.5 14.2" dur="1.1s" repeatCount="indefinite"/>
        </circle>

        <!-- User Prompt Bubble (#fbfbfb + #dfdfdf) -->
        <rect x="8" y="24.5" width="56" height="15" rx="5" fill="#fbfbfb" stroke="#dfdfdf" stroke-width="0.9"/>
        <rect x="11" y="27.5" width="10" height="9" rx="2" fill="#efefef" stroke="#dfdfdf" stroke-width="0.6"/>
        <rect x="24" y="28.5" width="35" height="2.5" rx="1.2" fill="#101010"/>
        <rect x="24" y="33" width="24" height="2.2" rx="1.1" fill="#7a7a7a"/>

        <!-- "Worked >" + "6 files changed +374 -55" Row -->
        <rect x="8" y="43" width="22" height="3" rx="1.5" fill="#7a7a7a" opacity="0.75"/>
        <rect x="8" y="49" width="54" height="10" rx="4" fill="#fbfbfb" stroke="#dfdfdf" stroke-width="0.8"/>
        <rect x="11" y="52.8" width="22" height="2.4" rx="1.2" fill="#4a4a4a"/>
        <!-- Green +374 and Red -55 -->
        <rect x="36" y="52.8" width="10" height="2.4" rx="1.2" fill="#63984f"/>
        <rect x="48" y="52.8" width="9" height="2.4" rx="1.2" fill="#de5555"/>

        <!-- Assistant Prose + Crimson Inline Code Pills (`rgb(163, 21, 21)`) -->
        <rect x="8" y="63" width="52" height="2.6" rx="1.3" fill="#101010"/>
        <!-- Crimson Inline Code Pill 1 -->
        <rect x="8" y="68.5" width="25" height="6" rx="2.5" fill="#efefef"/>
        <rect x="10.5" y="70.5" width="20" height="2" rx="1" fill="#a31515"/>
        <!-- Crimson Inline Code Pill 2 -->
        <rect x="35.5" y="68.5" width="24" height="6" rx="2.5" fill="#efefef"/>
        <rect x="38" y="70.5" width="19" height="2" rx="1" fill="#a31515"/>
        <rect x="8" y="77.5" width="44" height="2.5" rx="1.2" fill="#4a4a4a"/>

        <!-- Stationary Bottom Composer (`#fbfbfb` + `+` + Model Pill + `#101010` Send Circle) -->
        <rect x="6.5" y="85" width="59" height="24" rx="7" fill="#fbfbfb" stroke="#dfdfdf" stroke-width="0.9"/>
        <rect x="10.5" y="89" width="38" height="2.5" rx="1.2" fill="#7a7a7a"/>
        <path d="M 11.5 102 L 15.5 102 M 13.5 100 L 13.5 104" stroke="#4a4a4a" stroke-width="1.2" stroke-linecap="round"/>
        <rect x="19" y="99.5" width="25" height="5" rx="2.5" fill="#efefef"/>
        <rect x="21.5" y="101" width="20" height="2" rx="1" fill="#4a4a4a"/>
        <circle cx="58.5" cy="102" r="4.8" fill="#101010"/>
        <path d="M 58.5 104.2 L 58.5 99.8 M 56.6 101.5 L 58.5 99.6 L 60.4 101.5" fill="none" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
    </g>

    <!-- Top-Right Telemetry Badge (Outer translate wrapper + Inner CSS pulse) -->
    <g transform="translate(382, 15)">
      <g class="hudPulse" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, monospace">
        <rect x="0" y="0" width="180" height="22" rx="11" fill="#f9f9f9" fill-opacity="0.96" stroke="#dfdfdf" stroke-width="1"/>
        <circle cx="12" cy="11" r="3.3" fill="#63984f">
          <animate attributeName="opacity" values="1;0.3;1" dur="1.4s" repeatCount="indefinite"/>
        </circle>
        <g transform="translate(20, 4.5) scale(0.072)" fill="#101010">
          <use href="#agyOfficialMark"/>
        </g>
        <text x="106" y="14.5" fill="#101010" font-size="8.6" font-weight="800" text-anchor="middle" letter-spacing="0.4">ANTIGRAVITY · LIVE BRIDGE</text>
      </g>
    </g>

    <!-- ==================== FOREGROUND CARD CONTENT (LEFT ALIGNED) ==================== -->
    <g transform="translate(28, 28)" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif">
      <!-- Top Capsule with Official Antigravity Logo -->
      <rect x="0" y="0" width="278" height="28" rx="14" fill="#f9f9f9" fill-opacity="0.96" stroke="#dfdfdf" stroke-width="1.2"/>
      <g transform="translate(11, 5) scale(0.1)" fill="#101010">
        <use href="#agyOfficialMark"/>
      </g>
      <text x="151" y="18.5" fill="#101010" font-size="10.2" font-weight="800" text-anchor="middle" letter-spacing="0.6">ANTIGRAVITY MOBILE · 1:1 CLONE</text>

      <!-- Title -->
      <text x="0" y="62" fill="#f9f9f9" font-size="23" font-weight="800" letter-spacing="0.3">Steimber / agy-pocket</text>

      <!-- Description -->
      <text x="0" y="92" fill="#e2e8f0" font-size="13" opacity="0.96">1:1 mobile clone of Antigravity Desktop with permanent session,</text>
      <text x="0" y="112" fill="#bae6fd" font-size="13" opacity="0.96">projects, live model switcher, photo/file uploads, and tunnel.</text>

      <!-- Bottom Translucent Capsules -->
      <g transform="translate(0, 138)" font-size="11.5" font-weight="600">
        <rect x="0" y="0" width="110" height="28" rx="14" fill="#f9f9f9" fill-opacity="0.95" stroke="#dfdfdf" stroke-width="1"/>
        <text x="55" y="18" fill="#101010" font-weight="700" text-anchor="middle">Antigravity UI</text>

        <rect x="118" y="0" width="112" height="28" rx="14" fill="#efefef" fill-opacity="0.95" stroke="#dfdfdf" stroke-width="1"/>
        <text x="174" y="18" fill="#a31515" font-weight="700" text-anchor="middle">Model Switch</text>

        <rect x="238" y="0" width="114" height="28" rx="14" fill="#0c192c" fill-opacity="0.92" stroke="#63984f" stroke-width="1.1"/>
        <text x="295" y="18" fill="#dcfce7" text-anchor="middle">AES-256 Tunnel</text>

        <rect x="394" y="0" width="130" height="28" rx="14" fill="#007acc" fill-opacity="0.96" stroke="#7dd3fc" stroke-width="1.2"/>
        <text x="459" y="18" fill="#ffffff" font-weight="700" text-anchor="middle">Open Repo →</text>
      </g>
    </g>
  </g>

  <rect x="1" y="1" width="578" height="228" rx="16" fill="none" stroke="#38bdf8" stroke-width="1.6" stroke-opacity="0.68"/>
</svg>
