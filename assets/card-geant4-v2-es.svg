      <text x="0" y="62" fill="#fefce8" font-size="23" font-weight="800" letter-spacing="0.3">proyecto-geant4 · Rayos Cósmicos</text>

      <!-- Description -->
      <text x="0" y="92" fill="#d1fae5" font-size="13.5" opacity="0.88">Simulación Monte Carlo en C++ y Geant4 de lluvias de partículas</text>
      <text x="0" y="112" fill="#d1fae5" font-size="13.5" opacity="0.88">atmosféricas con visualización 3D X11 e imagen en Docker Hub.</text>

