<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 230" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#05160e"/>
      <stop offset="65%" stop-color="#0e2d1c"/>
      <stop offset="100%" stop-color="#163f28"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="88%" cy="18%" r="55%">
      <stop offset="0%" stop-color="#fde047" stop-opacity="0.18"/>
      <stop offset="50%" stop-color="#22c55e" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#05160e" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="cardClip">
      <rect width="580" height="230" rx="16"/>
