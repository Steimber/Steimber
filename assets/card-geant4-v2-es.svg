      <g transform="translate(0, 138)" font-size="11.5" font-weight="600">
        <rect x="0" y="0" width="116" height="28" rx="14" fill="#05160e" fill-opacity="0.78" stroke="#4ade80" stroke-width="1" stroke-opacity="0.35"/>
        <text x="58" y="18" fill="#ecfdf5" text-anchor="middle">Geant4 Physics</text>

        <rect x="126" y="0" width="98" height="28" rx="14" fill="#05160e" fill-opacity="0.78" stroke="#4ade80" stroke-width="1" stroke-opacity="0.35"/>
