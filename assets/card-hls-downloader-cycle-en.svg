<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 230" width="100%" height="100%">
  <defs>
    <!-- Anime Midnight Cyber-Sakura Sky Gradient -->
    <linearGradient id="animeSky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070312">
        <animate attributeName="stop-color" values="#070312;#0d0520;#05020d;#070312" dur="16s" repeatCount="indefinite"/>
      </stop>
      <stop offset="55%" stop-color="#1a092b">
        <animate attributeName="stop-color" values="#1a092b;#270d3b;#130621;#1a092b" dur="16s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#3d0e31">
        <animate attributeName="stop-color" values="#3d0e31;#52123e;#2b0923;#3d0e31" dur="16s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <radialGradient id="crimsonMoonGlow" cx="82%" cy="42%" r="52%">
      <stop offset="0%" stop-color="#fb7185" stop-opacity="0.38">
        <animate attributeName="stop-opacity" values="0.26;0.44;0.26" dur="5s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#c026d3" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#070312" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="crimsonMoon" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fda4af"/>
      <stop offset="50%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#9f1239"/>
    </linearGradient>

    <clipPath id="cardClip">
      <rect width="580" height="230" rx="16"/>
    </clipPath>

    <!-- Sakura Petal Shape -->
    <path id="sakuraPetal" d="M 0 -6 C 3.5 -6 5 -2 0 6 C -5 -2 -3.5 -6 0 -6 M -1.2 -5.5 L 0 -3.2 L 1.2 -5.5" fill="#f9a8d4"/>
    <path id="sakuraSmall" d="M 0 -4 C 2.5 -4 3.5 -1 0 4.5 C -3.5 -1 -2.5 -4 0 -4" fill="#fbcfe8"/>
  </defs>

  <style>
    .sfall1 { animation: sakuraA 6.2s linear infinite; }
    .sfall2 { animation: sakuraB 7.8s linear infinite -1.8s; }
    .sfall3 { animation: sakuraA 5.5s linear infinite -3.4s; }
    .sfall4 { animation: sakuraB 8.4s linear infinite -4.9s; }
    .sfall5 { animation: sakuraA 6.9s linear infinite -2.2s; }
    .sfall6 { animation: sakuraB 7.1s linear infinite -5.7s; }
    .shootingStar { animation: meteor 5.5s ease-in-out infinite; }
    @keyframes sakuraA {
      0% { transform: translate(20px, -20px) rotate(0deg); opacity: 0; }
      15% { opacity: 0.85; }
      85% { opacity: 0.85; }
      100% { transform: translate(-75px, 250px) rotate(220deg); opacity: 0; }
    }
    @keyframes sakuraB {
      0% { transform: translate(10px, -20px) rotate(35deg); opacity: 0; }
      15% { opacity: 0.7; }
      85% { opacity: 0.7; }
      100% { transform: translate(-55px, 250px) rotate(-190deg); opacity: 0; }
    }
    @keyframes meteor {
      0%, 72% { transform: translate(0px, 0px); opacity: 0; }
      76% { opacity: 0.95; }
      88%, 100% { transform: translate(-240px, 75px); opacity: 0; }
    }
  </style>

  <g clip-path="url(#cardClip)">
    <rect width="580" height="230" fill="url(#animeSky)"/>
    <rect width="580" height="230" fill="url(#crimsonMoonGlow)"/>

    <!-- Twinkling Anime Night Stars -->
    <g fill="#fdf2f8">
      <circle cx="380" cy="30" r="1.2"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.6s" repeatCount="indefinite"/></circle>
      <circle cx="430" cy="22" r="1.5"><animate attributeName="opacity" values="0.9;0.2;0.9" dur="3.1s" repeatCount="indefinite"/></circle>
      <circle cx="545" cy="34" r="1.3"><animate attributeName="opacity" values="0.3;0.95;0.3" dur="2.2s" repeatCount="indefinite"/></circle>
      <!-- 4-Pointed Anime Sparkle Star -->
      <path d="M 408 46 Q 414 46 414 40 Q 414 46 420 46 Q 414 46 414 52 Q 414 46 408 46 Z" fill="#fbcfe8">
        <animate attributeName="opacity" values="0.25;1;0.25" dur="2.4s" repeatCount="indefinite"/>
      </path>
    </g>

    <!-- Shooting Star / Katana Slash Streak -->
    <g class="shootingStar">
      <line x1="560" y1="18" x2="505" y2="35" stroke="#fbcfe8" stroke-width="1.8" stroke-linecap="round" opacity="0.85"/>
      <circle cx="505" cy="35" r="2" fill="#ffffff"/>
    </g>

    <!-- Giant Crimson Anime Moon on Right -->
    <circle cx="482" cy="108" r="54" fill="url(#crimsonMoon)" opacity="0.72">
      <animate attributeName="r" values="53;55.5;53" dur="5s" repeatCount="indefinite"/>
    </circle>

    <!-- Mount Fuji Silhouette -->
    <path d="M 320 218 L 402 146 L 430 146 L 518 218 Z" fill="#160621" opacity="0.88"/>
    <path d="M 402 146 L 430 146 L 444 159 L 433 156 L 424 162 L 416 155 L 407 161 L 390 157 Z" fill="#fbcfe8" opacity="0.45"/>

    <!-- Traditional Japanese Torii Gate Silhouette in Front of Crimson Moon -->
    <g transform="translate(482, 134)" fill="#0c0314">
      <!-- Top Curved Kasagi Beam -->
      <path d="M -52 -42 Q 0 -34 52 -42 L 48 -33 Q 0 -27 -48 -33 Z"/>
      <!-- Second Shimaki Beam -->
      <rect x="-42" y="-23" width="84" height="6" rx="1.5"/>
      <!-- Center Tablet (Gakuzuka) -->
      <rect x="-5" y="-34" width="10" height="12" rx="1"/>
      <!-- Left & Right Pillars -->
      <path d="M -31 -34 L -24 -34 L -27 52 L -35 52 Z"/>
      <path d="M 24 -34 L 31 -34 L 35 52 L 27 52 Z"/>
      <!-- Glowing Paper Lanterns Hanging from Torii -->
      <ellipse cx="-16" cy="-12" rx="3.2" ry="4.8" fill="#fb7185">
        <animate attributeName="opacity" values="0.65;1;0.65" dur="2.2s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="16" cy="-12" rx="3.2" ry="4.8" fill="#fb7185">
        <animate attributeName="opacity" values="1;0.65;1" dur="2.2s" repeatCount="indefinite"/>
      </ellipse>
    </g>

    <!-- Misty Horizon & Sakura Hills Along Bottom -->
    <path d="M 0 206 Q 140 186 290 204 T 580 194 L 580 230 L 0 230 Z" fill="#12041c" opacity="0.92"/>
    <rect x="0" y="212" width="580" height="18" fill="#08020f"/>

    <!-- Drifting Sakura Petals Across Card -->
    <g>
      <g transform="translate(140, 0)"><g class="sfall1"><use href="#sakuraPetal"/></g></g>
      <g transform="translate(260, 0)"><g class="sfall2"><use href="#sakuraSmall"/></g></g>
      <g transform="translate(370, 0)"><g class="sfall3"><use href="#sakuraPetal"/></g></g>
      <g transform="translate(465, 0)"><g class="sfall4"><use href="#sakuraSmall"/></g></g>
      <g transform="translate(535, 0)"><g class="sfall5"><use href="#sakuraPetal"/></g></g>
      <g transform="translate(575, 0)"><g class="sfall6"><use href="#sakuraSmall"/></g></g>
    </g>

    <!-- Foreground Card Content -->
    <g transform="translate(28, 28)" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif">
      <!-- Top Translucent Capsule with Mini Torii Icon -->
      <rect x="0" y="0" width="242" height="28" rx="14" fill="#11041c" fill-opacity="0.88" stroke="#f472b6" stroke-width="1.2" stroke-opacity="0.65"/>
      <g transform="translate(18, 14)" fill="#fb7185">
        <path d="M -8 -6 Q 0 -4.5 8 -6 L 7 -3.8 Q 0 -2.8 -7 -3.8 Z"/>
        <rect x="-6.5" y="-1.8" width="13" height="1.6" rx="0.5"/>
        <rect x="-5" y="-4" width="1.8" height="10.5"/>
        <rect x="3.2" y="-4" width="1.8" height="10.5"/>
      </g>
      <text x="134" y="18.5" fill="#fce7f3" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="0.8">ANIME · OFFLINE STREAM CLI</text>

      <!-- Title -->
      <text x="0" y="62" fill="#fff1f2" font-size="23" font-weight="800" letter-spacing="0.3">Steimber / MyAnimeAnywhere</text>

      <!-- Description -->
      <text x="0" y="92" fill="#fbcfe8" font-size="13.5" opacity="0.94">Concurrent episodic HLS (.m3u8) downloader for offline viewing</text>
      <text x="0" y="112" fill="#fbcfe8" font-size="13.5" opacity="0.94">with 12 parallel workers, retry backoff, and ordered flushing.</text>

      <!-- Bottom Translucent Capsules -->
      <g transform="translate(0, 138)" font-size="11.5" font-weight="600">
        <rect x="0" y="0" width="108" height="28" rx="14" fill="#11041c" fill-opacity="0.86" stroke="#f472b6" stroke-width="1" stroke-opacity="0.52"/>
        <text x="54" y="18" fill="#fce7f3" text-anchor="middle">Node.js CLI</text>
        <rect x="118" y="0" width="118" height="28" rx="14" fill="#11041c" fill-opacity="0.86" stroke="#f472b6" stroke-width="1" stroke-opacity="0.52"/>
        <text x="177" y="18" fill="#fce7f3" text-anchor="middle">HLS / RFC 8216</text>
        <rect x="246" y="0" width="106" height="28" rx="14" fill="#11041c" fill-opacity="0.86" stroke="#f472b6" stroke-width="1" stroke-opacity="0.52"/>
        <text x="299" y="18" fill="#fce7f3" text-anchor="middle">12x Workers</text>

        <rect x="394" y="0" width="130" height="28" rx="14" fill="#1f0626" fill-opacity="0.92" stroke="#fb7185" stroke-width="1.2" stroke-opacity="0.78"/>
        <text x="459" y="18" fill="#ffe4e6" font-weight="700" text-anchor="middle">Open repo →</text>
      </g>
    </g>
  </g>

  <rect x="1" y="1" width="578" height="228" rx="16" fill="none" stroke="#db2777" stroke-width="1.6" stroke-opacity="0.6"/>
</svg>
