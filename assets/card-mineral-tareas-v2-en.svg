  <style>
    .fall1 { animation: cfall1 6.5s linear infinite; }
    .fall2 { animation: cfall2 8.2s linear infinite; }
    .fall3 { animation: cfall1 7.4s linear infinite -2.5s; }
    .fall4 { animation: cfall2 9.1s linear infinite -4.1s; }
    .fall5 { animation: cfall1 5.8s linear infinite -1.3s; }
    .fall6 { animation: cfall2 7.9s linear infinite -5.2s; }
    .clusterFloat { animation: cfloat 5s ease-in-out infinite alternate; }
    @keyframes cfall1 {
      0% { transform: translate(0px, -30px) rotate(-12deg); opacity: 0; }
      15% { opacity: 0.75; }
      85% { opacity: 0.75; }
      100% { transform: translate(-18px, 260px) rotate(24deg); opacity: 0; }
    }
    @keyframes cfall2 {
      0% { transform: translate(0px, -30px) rotate(15deg); opacity: 0; }
      15% { opacity: 0.6; }
      85% { opacity: 0.6; }
      100% { transform: translate(16px, 260px) rotate(-22deg); opacity: 0; }
    }
    @keyframes cfloat {
      0% { transform: translate(375px, 6px) scale(0.46) rotate(-1.5deg); }
      100% { transform: translate(375px, -4px) scale(0.475) rotate(1.5deg); }
    }
  </style>

