<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 230" width="100%" height="100%">
  <defs>
    <!-- Mineral Obsidian & Terracotta Animated Background -->
    <linearGradient id="mineralBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d0806">
        <animate attributeName="stop-color" values="#0d0806;#140b08;#090605;#0d0806" dur="18s" repeatCount="indefinite"/>
      </stop>
      <stop offset="55%" stop-color="#1f110c">
        <animate attributeName="stop-color" values="#1f110c;#2b160f;#160c09;#1f110c" dur="18s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#381d13">
        <animate attributeName="stop-color" values="#381d13;#4a2518;#26130d;#381d13" dur="18s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <radialGradient id="crystalGlow" cx="82%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#d97757" stop-opacity="0.32">
        <animate attributeName="stop-opacity" values="0.22;0.38;0.22" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="55%" stop-color="#b3613d" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#0d0806" stop-opacity="0"/>
    </radialGradient>

    <clipPath id="cardClip">
      <rect width="580" height="230" rx="16"/>
    </clipPath>

    <!-- Faceted Falling Mineral Crystal Shard -->
    <g id="crystalShard">
      <polygon points="0,-14 -6,-4 -3,12 3,12 6,-4" fill="#d97757"/>
      <polygon points="0,-14 6,-4 3,12 0,12" fill="#9c4f2f"/>
      <polygon points="0,-14 -6,-4 0,-2 6,-4" fill="#f4b196" opacity="0.9"/>
    </g>

    <g id="crystalSmall">
      <polygon points="0,-9 -4,-2 -2,8 2,8 4,-2" fill="#e08a6b"/>
      <polygon points="0,-9 4,-2 2,8 0,8" fill="#b3613d"/>
      <polygon points="0,-9 -4,-2 0,-1 4,-2" fill="#fde047" opacity="0.75"/>
    </g>

