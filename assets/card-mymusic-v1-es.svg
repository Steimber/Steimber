<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 230" width="100%" height="100%">
  <defs>
    <!-- Studio Mastering Crimson Red & Obsidian Animated Background -->
    <linearGradient id="studioBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d0304">
        <animate attributeName="stop-color" values="#0d0304;#170507;#080203;#0d0304" dur="16s" repeatCount="indefinite"/>
      </stop>
      <stop offset="55%" stop-color="#24070a">
        <animate attributeName="stop-color" values="#24070a;#330a0e;#1a0507;#24070a" dur="16s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#450c12">
        <animate attributeName="stop-color" values="#450c12;#590f17;#30080c;#450c12" dur="16s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <!-- Acoustic Radial Aura Around Turntable -->
    <radialGradient id="vinylAura" cx="83%" cy="46%" r="52%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.38">
        <animate attributeName="stop-opacity" values="0.24;0.44;0.24" dur="4.5s" repeatCount="indefinite"/>
      </stop>
      <stop offset="48%" stop-color="#f97316" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#0d0304" stop-opacity="0"/>
    </radialGradient>

    <!-- Vinyl Disc Base Metallic Gradient -->
    <linearGradient id="vinylDiscGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#261416"/>
      <stop offset="45%" stop-color="#0f0708"/>
      <stop offset="55%" stop-color="#33181b"/>
      <stop offset="100%" stop-color="#0a0405"/>
    </linearGradient>

    <!-- Anisotropic Vinyl Sheen Highlight -->
    <linearGradient id="vinylSheen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f87171" stop-opacity="0"/>
      <stop offset="45%" stop-color="#ef4444" stop-opacity="0.26"/>
      <stop offset="55%" stop-color="#fb923c" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#fb923c" stop-opacity="0"/>
    </linearGradient>

    <!-- Center CoverLock Album Art Label Gradient -->
    <linearGradient id="coverLabelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="55%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>

    <!-- Equalizer Bar Vertical Gradient -->
    <linearGradient id="eqGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#991b1b" stop-opacity="0.4"/>
      <stop offset="65%" stop-color="#ef4444" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#fecaca" stop-opacity="0.98"/>
    </linearGradient>

    <!-- Acoustic Grid Pattern -->
    <pattern id="studioGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="0.8" fill="#ef4444" fill-opacity="0.22"/>
    </pattern>

    <clipPath id="cardClip">
      <rect width="580" height="230" rx="16"/>
    </clipPath>

    <!-- Musical Note Shapes -->
    <g id="noteSingle" fill="#fca5a5">
      <ellipse cx="0" cy="0" rx="3.4" ry="2.4" transform="rotate(-20)"/>
      <rect x="2" y="-10" width="1.4" height="10"/>
      <path d="M 3.4 -10 Q 8 -8 6.5 -4 Q 6 -6.5 3.4 -7.2 Z"/>
    </g>
    <g id="noteDouble" fill="#fdba74">
      <ellipse cx="-4" cy="1" rx="3" ry="2.1" transform="rotate(-18 -4 1)"/>
      <ellipse cx="4" cy="-1" rx="3" ry="2.1" transform="rotate(-18 4 -1)"/>
      <rect x="-1.8" y="-9" width="1.3" height="10"/>
      <rect x="6.2" y="-11" width="1.3" height="10"/>
      <path d="M -1.8 -9 L 7.5 -11 L 7.5 -8.5 L -1.8 -6.5 Z"/>
    </g>
  </defs>

  <style>
    .vinylSpin {
      transform-origin: 482px 104px;
      animation: spinRecord 9s linear infinite;
    }
    .tonearmTrack {
      transform-origin: 548px 46px;
      animation: armGroove 4.5s ease-in-out infinite alternate;
    }
    .noteFloat1 { animation: floatNoteA 5.8s ease-in-out infinite; }
    .noteFloat2 { animation: floatNoteB 6.6s ease-in-out infinite -2.1s; }
    .noteFloat3 { animation: floatNoteA 5.2s ease-in-out infinite -3.7s; }
    .hudPulse { animation: lockGlow 3.2s ease-in-out infinite; }

    @keyframes spinRecord {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes armGroove {
      0% { transform: rotate(18deg); }
      100% { transform: rotate(21.5deg); }
    }
    @keyframes floatNoteA {
      0% { transform: translate(0px, 12px) scale(0.75) rotate(-10deg); opacity: 0; }
      25% { opacity: 0.9; }
      80% { opacity: 0.75; }
      100% { transform: translate(-26px, -48px) scale(1.05) rotate(14deg); opacity: 0; }
    }
    @keyframes floatNoteB {
      0% { transform: translate(0px, 10px) scale(0.7) rotate(8deg); opacity: 0; }
      25% { opacity: 0.85; }
      80% { opacity: 0.7; }
      100% { transform: translate(18px, -52px) scale(1) rotate(-16deg); opacity: 0; }
    }
    @keyframes lockGlow {
      0%, 100% { opacity: 0.86; }
      50% { opacity: 1; }
    }
  </style>

  <g clip-path="url(#cardClip)">
    <!-- Background Layers -->
    <rect width="580" height="230" fill="url(#studioBg)"/>
    <rect width="580" height="230" fill="url(#studioGrid)"/>
    <rect width="580" height="230" fill="url(#vinylAura)"/>

    <!-- Expanding Acoustic Sonic Rings Behind Vinyl -->
    <g fill="none" stroke="#ef4444">
      <circle cx="482" cy="104" r="56" stroke-width="1.2" opacity="0.38">
        <animate attributeName="r" values="54;78" dur="3.6s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.45;0" dur="3.6s" repeatCount="indefinite"/>
      </circle>
      <circle cx="482" cy="104" r="56" stroke-width="1" opacity="0.28" stroke="#fb923c">
        <animate attributeName="r" values="54;82" dur="3.6s" begin="1.8s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.35;0" dur="3.6s" begin="1.8s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- Studio Horizon & Waveform Base -->
    <path d="M 0 208 Q 145 194 295 206 T 580 196 L 580 230 L 0 230 Z" fill="#140406" opacity="0.92"/>
    <rect x="0" y="214" width="580" height="16" fill="#090203"/>

    <!-- Live Studio Equalizer Spectrum (Right-Side Deck) -->
    <g fill="url(#eqGrad)" opacity="0.9">
      <rect x="394" y="150" width="4.5" height="24" rx="2">
        <animate attributeName="y" values="154;138;154" dur="1.1s" repeatCount="indefinite"/>
        <animate attributeName="height" values="20;36;20" dur="1.1s" repeatCount="indefinite"/>
      </rect>
      <rect x="403" y="142" width="4.5" height="32" rx="2">
        <animate attributeName="y" values="146;126;146" dur="0.85s" repeatCount="indefinite"/>
        <animate attributeName="height" values="28;48;28" dur="0.85s" repeatCount="indefinite"/>
      </rect>
      <rect x="412" y="136" width="4.5" height="38" rx="2">
        <animate attributeName="y" values="132;152;132" dur="1.25s" repeatCount="indefinite"/>
        <animate attributeName="height" values="42;22;42" dur="1.25s" repeatCount="indefinite"/>
      </rect>
      <rect x="421" y="144" width="4.5" height="30" rx="2">
        <animate attributeName="y" values="148;122;148" dur="0.95s" repeatCount="indefinite"/>
        <animate attributeName="height" values="26;52;26" dur="0.95s" repeatCount="indefinite"/>
      </rect>
      <rect x="535" y="140" width="4.5" height="34" rx="2">
        <animate attributeName="y" values="146;128;146" dur="1.05s" repeatCount="indefinite"/>
        <animate attributeName="height" values="28;46;28" dur="1.05s" repeatCount="indefinite"/>
      </rect>
      <rect x="544" y="146" width="4.5" height="28" rx="2">
        <animate attributeName="y" values="134;154;134" dur="0.9s" repeatCount="indefinite"/>
        <animate attributeName="height" values="40;20;40" dur="0.9s" repeatCount="indefinite"/>
      </rect>
      <rect x="553" y="150" width="4.5" height="24" rx="2">
        <animate attributeName="y" values="152;136;152" dur="1.2s" repeatCount="indefinite"/>
        <animate attributeName="height" values="22;38;22" dur="1.2s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- Spinning Hi-Res Vinyl Record + CoverLock Center Art -->
    <g class="vinylSpin">
      <!-- Outer Record Rim -->
      <circle cx="482" cy="104" r="53" fill="url(#vinylDiscGrad)" stroke="#f87171" stroke-width="1.2" stroke-opacity="0.55"/>
      <!-- Anisotropic Light Reflection Wedges -->
      <path d="M 482 104 L 442 64 A 53 53 0 0 1 522 64 Z" fill="url(#vinylSheen)"/>
      <path d="M 482 104 L 522 144 A 53 53 0 0 1 442 144 Z" fill="url(#vinylSheen)"/>
      <!-- Concentric Micro-Grooves -->
      <circle cx="482" cy="104" r="46" fill="none" stroke="#f87171" stroke-width="0.6" stroke-opacity="0.25" stroke-dasharray="18 8"/>
      <circle cx="482" cy="104" r="39" fill="none" stroke="#fecaca" stroke-width="0.6" stroke-opacity="0.18"/>
      <circle cx="482" cy="104" r="32" fill="none" stroke="#fb923c" stroke-width="0.7" stroke-opacity="0.28" stroke-dasharray="12 6"/>
      <circle cx="482" cy="104" r="25" fill="none" stroke="#f87171" stroke-width="0.6" stroke-opacity="0.24"/>
      <!-- Center Album Cover Art Label (CoverLock Anchor) -->
      <circle cx="482" cy="104" r="18.5" fill="url(#coverLabelGrad)" stroke="#fee2e2" stroke-width="1"/>
      <!-- Mini Album Cover Frame Inside Vinyl Label -->
      <rect x="473.5" y="95.5" width="17" height="17" rx="3.5" fill="#140406" fill-opacity="0.45" stroke="#fee2e2" stroke-width="0.8" stroke-opacity="0.75"/>
      <!-- Center Spindle Hole -->
      <circle cx="482" cy="104" r="3.4" fill="#0d0304" stroke="#fecaca" stroke-width="1"/>
    </g>

    <!-- Studio Turntable Tonearm & Cartridge -->
    <g class="tonearmTrack">
      <!-- Pivot Base -->
      <circle cx="548" cy="46" r="8" fill="#1c0608" stroke="#f87171" stroke-width="1.3"/>
      <circle cx="548" cy="46" r="3.5" fill="#ef4444"/>
      <!-- Tonearm Rod -->
      <path d="M 548 46 L 542 96 L 524 118" fill="none" stroke="#fee2e2" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- Stylus Cartridge Head -->
      <rect x="518" y="114" width="9" height="5.5" rx="1.5" transform="rotate(-38 522 117)" fill="#dc2626" stroke="#fee2e2" stroke-width="0.8"/>
      <!-- Laser Lock Indicator at Needle Tip -->
      <circle cx="519" cy="120" r="2" fill="#fef08a">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="1.2s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- Floating Musical Notes Drifting from Vinyl -->
    <g transform="translate(432, 74)"><g class="noteFloat1"><use href="#noteSingle"/></g></g>
    <g transform="translate(520, 62)"><g class="noteFloat2"><use href="#noteDouble"/></g></g>
    <g transform="translate(465, 52)"><g class="noteFloat3"><use href="#noteSingle"/></g></g>

    <!-- CoverLock™ DSP Telemetry Badge (Top-Right Studio HUD) -->
    <g class="hudPulse" transform="translate(388, 16)" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, monospace">
      <rect x="0" y="0" width="168" height="22" rx="11" fill="#170406" fill-opacity="0.92" stroke="#ef4444" stroke-width="1" stroke-opacity="0.78"/>
      <circle cx="12" cy="11" r="3.5" fill="#ef4444">
        <animate attributeName="opacity" values="1;0.25;1" dur="1.4s" repeatCount="indefinite"/>
      </circle>
      <text x="90" y="14.5" fill="#fecaca" font-size="9.5" font-weight="700" text-anchor="middle" letter-spacing="0.5">COVERLOCK™ · ±8s HI-RES</text>
    </g>

    <!-- Foreground Card Content (Left Aligned) -->
    <g transform="translate(28, 28)" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif">
      <!-- Top Translucent Capsule with Mini Vinyl/Wave Icon -->
      <rect x="0" y="0" width="256" height="28" rx="14" fill="#190507" fill-opacity="0.88" stroke="#ef4444" stroke-width="1.2" stroke-opacity="0.68"/>
      <g transform="translate(18, 14)">
        <circle cx="0" cy="0" r="6.5" fill="none" stroke="#f87171" stroke-width="1.5"/>
        <circle cx="0" cy="0" r="2.2" fill="#ef4444"/>
      </g>
      <text x="140" y="18.5" fill="#fee2e2" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="0.8">PWA · COVERLOCK™ AUDIO DSP</text>

      <!-- Title -->
      <text x="0" y="62" fill="#fef2f2" font-size="23" font-weight="800" letter-spacing="0.3">Steimber / MyMusicAnywhere</text>

      <!-- Description -->
      <text x="0" y="92" fill="#fecaca" font-size="13.5" opacity="0.94">Reproductor y streamer PWA offline-first con motor propio</text>
      <text x="0" y="112" fill="#fecaca" font-size="13.5" opacity="0.94">CoverLock™ DSP: validación por portada y ruteo multi-fuente.</text>

      <!-- Bottom Translucent Capsules -->
      <g transform="translate(0, 138)" font-size="11.5" font-weight="600">
        <rect x="0" y="0" width="104" height="28" rx="14" fill="#190507" fill-opacity="0.86" stroke="#ef4444" stroke-width="1" stroke-opacity="0.52"/>
        <text x="52" y="18" fill="#fee2e2" text-anchor="middle">Next.js PWA</text>

        <rect x="114" y="0" width="122" height="28" rx="14" fill="#190507" fill-opacity="0.86" stroke="#fb923c" stroke-width="1" stroke-opacity="0.65"/>
        <text x="175" y="18" fill="#ffedd5" text-anchor="middle">CoverLock™ DSP</text>

        <rect x="246" y="0" width="106" height="28" rx="14" fill="#190507" fill-opacity="0.86" stroke="#ef4444" stroke-width="1" stroke-opacity="0.52"/>
        <text x="299" y="18" fill="#fee2e2" text-anchor="middle">IndexedDB</text>

        <rect x="394" y="0" width="130" height="28" rx="14" fill="#2b070b" fill-opacity="0.94" stroke="#f87171" stroke-width="1.2" stroke-opacity="0.85"/>
        <text x="459" y="18" fill="#fef2f2" font-weight="700" text-anchor="middle">Abrir repo →</text>
      </g>
    </g>
  </g>

  <rect x="1" y="1" width="578" height="228" rx="16" fill="none" stroke="#dc2626" stroke-width="1.6" stroke-opacity="0.65"/>
</svg>
