<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Sunrise over Emerald Forest Sky Gradient -->
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#061910"/>
      <stop offset="38%" stop-color="#113823"/>
      <stop offset="72%" stop-color="#286046"/>
      <stop offset="92%" stop-color="#b58328"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <!-- Sun & Atmospheric Glow -->
    <radialGradient id="sunHalo" cx="50%" cy="58%" r="48%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.9"/>
      <stop offset="28%" stop-color="#fbbf24" stop-opacity="0.52"/>
      <stop offset="60%" stop-color="#22c55e" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#061910" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="sunCore" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="50%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <linearGradient id="mist" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fde68a" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#0d2818" stop-opacity="0"/>
    </linearGradient>

    <filter id="textShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#04120a" flood-opacity="0.8"/>
    </filter>

    <clipPath id="bannerClip">
      <rect width="1200" height="360" rx="18"/>
    </clipPath>
    <clipPath id="ecFlag">
      <rect width="24" height="16" rx="3"/>
    </clipPath>
  </defs>

  <g clip-path="url(#bannerClip)">
    <!-- Sky Background -->
    <rect width="1200" height="360" fill="url(#sky)"/>
    <rect width="1200" height="360" fill="url(#sunHalo)"/>

    <!-- Rising Golden Sun -->
    <circle cx="600" cy="205" r="95" fill="#fde047" opacity="0.24">
      <animate attributeName="r" values="90;102;90" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="600" cy="205" r="66" fill="url(#sunCore)"/>

    <!-- Distant Sunlit Mountain Range (Layer 1) -->
    <path d="M -20 265 L 90 198 L 195 235 L 325 172 L 445 228 L 560 190 L 650 225 L 775 168 L 900 226 L 1035 178 L 1145 222 L 1220 190 L 1220 360 L -20 360 Z" fill="#1b4630" opacity="0.9"/>

    <!-- Mid-Distant Forest Ridge (Layer 2) -->
    <path d="M -20 282 L 65 240 L 160 268 L 285 215 L 410 265 L 520 238 L 680 242 L 815 208 L 945 260 L 1080 220 L 1220 258 L 1220 360 L -20 360 Z" fill="#133523"/>

    <!-- Golden Morning Mist in the Valley -->
    <rect x="0" y="220" width="1200" height="55" fill="url(#mist)"/>

    <!-- Dense Pine Forest Treeline (Layer 3) -->
    <path d="
      M 0 360 L 0 262
      L 18 236 L 32 262 L 48 228 L 64 260 L 82 238 L 98 266
      L 118 232 L 136 264 L 154 222 L 172 260 L 190 238 L 208 268
      L 228 242 L 246 270 L 266 230 L 284 264 L 304 240 L 322 272
      L 344 246 L 362 274 L 382 238 L 400 270 L 420 250 L 438 278
      L 460 256 L 478 280 L 498 260 L 516 284 L 538 266 L 558 286
      L 642 286 L 662 266 L 684 284 L 702 260 L 722 280 L 740 256
      L 762 278 L 780 250 L 800 270 L 818 238 L 838 274 L 856 246
      L 878 272 L 896 240 L 916 264 L 934 230 L 954 270 L 972 242
      L 992 268 L 1010 238 L 1028 260 L 1046 222 L 1064 264 L 1082 232
      L 1102 266 L 1118 238 L 1136 260 L 1152 228 L 1168 262 L 1182 236
      L 1200 262 L 1200 360 Z" fill="#0b2416"/>

    <!-- Foreground Dark Pine Forest Silhouette (Layer 4) -->
    <path d="
      M 0 360 L 0 282
      L 24 244 L 44 285 L 68 234 L 92 282 L 114 250 L 136 288
      L 162 242 L 186 286 L 210 254 L 232 292 L 258 260 L 280 294
      L 308 264 L 330 298 L 356 270 L 380 300 L 408 278 L 432 302
      L 460 284 L 486 306 L 520 292 L 555 308 L 600 302 L 645 308
      L 680 292 L 714 306 L 740 284 L 768 302 L 792 278 L 820 300
      L 844 270 L 870 298 L 892 264 L 920 294 L 942 260 L 968 292
      L 990 254 L 1014 286 L 1038 242 L 1064 288 L 1086 250 L 1108 282
      L 1132 234 L 1156 285 L 1176 244 L 1200 282 L 1200 360 Z" fill="#05130b"/>

    <!-- Birds Flying Near the Sun -->
    <g stroke="#061910" stroke-width="2.2" fill="none" stroke-linecap="round" opacity="0.75">
      <path d="M 465 138 Q 472 130 479 137 Q 486 130 493 138"/>
      <path d="M 505 122 Q 510 116 515 121 Q 520 116 525 122"/>
      <path d="M 705 132 Q 711 125 717 131 Q 723 125 729 132"/>
    </g>

    <!-- Title & Subtitle -->
    <g filter="url(#textShadow)">
      <text x="600" y="108" fill="#fefce8" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Georgia, sans-serif" font-size="68" font-weight="900" text-anchor="middle" letter-spacing="7">STEIMBER</text>
      <text x="600" y="148" fill="#ecfdf5" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif" font-size="18.5" font-weight="600" text-anchor="middle" letter-spacing="0.8">
        Co-Founder of Mineral Studio  ·  Universidad Técnica de Manabí (UTM)
      </text>
    </g>

    <!-- Bottom Clean Pills -->
    <g transform="translate(105, 292)" font-family="'Segoe UI', -apple-system, sans-serif" font-size="13" font-weight="700">
      <g transform="translate(0, 0)">
        <rect width="240" height="40" rx="12" fill="#091910" fill-opacity="0.9" stroke="#d97706" stroke-width="1.5"/>
        <text x="120" y="25" fill="#fed7aa" text-anchor="middle">💎 Mineral Studio (Co-Founder)</text>
      </g>
      <g transform="translate(256, 0)">
        <rect width="235" height="40" rx="12" fill="#091910" fill-opacity="0.9" stroke="#22c55e" stroke-width="1.4"/>
        <text x="117.5" y="25" fill="#86efac" text-anchor="middle">🏛️ UTM · College_Projects</text>
      </g>
      <g transform="translate(507, 0)">
        <rect width="230" height="40" rx="12" fill="#091910" fill-opacity="0.9" stroke="#4ade80" stroke-width="1.4"/>
        <text x="115" y="25" fill="#bbf7d0" text-anchor="middle">💻 Personal Projects</text>
      </g>
      <g transform="translate(753, 0)">
        <rect width="235" height="40" rx="12" fill="#091910" fill-opacity="0.9" stroke="#eab308" stroke-width="1.4"/>
        <g transform="translate(26, 12)" clip-path="url(#ecFlag)">
          <rect x="0" y="0" width="24" height="8" fill="#FFD100"/>
          <rect x="0" y="8" width="24" height="4" fill="#0033A0"/>
          <rect x="0" y="12" width="24" height="4" fill="#EF3340"/>
          <circle cx="12" cy="8" r="2.2" fill="#d97706"/>
        </g>
        <text x="134" y="25" fill="#fef08a" text-anchor="middle">Manabí, Ecuador</text>
      </g>
    </g>
  </g>

  <rect width="1200" height="360" rx="18" fill="none" stroke="#1e462d" stroke-width="2"/>
</svg>
