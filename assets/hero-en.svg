<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050816"/>
      <stop offset="50%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="1"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ray1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="70%" stop-color="#38bdf8" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#e0f2fe" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="ray2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0"/>
      <stop offset="70%" stop-color="#a855f7" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#f3e8ff" stop-opacity="1"/>
    </linearGradient>
    <radialGradient id="glow1" cx="20%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="82%" cy="75%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.7" stroke-opacity="0.55"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="340" rx="18" fill="url(#bg)" stroke="#1e293b" stroke-width="2"/>
  <rect width="1200" height="340" rx="18" fill="url(#grid)"/>
  <rect width="1200" height="340" rx="18" fill="url(#glow1)"/>
  <rect width="1200" height="340" rx="18" fill="url(#glow2)"/>

  <!-- Cosmic Ray Shower Animation (Geant4 Inspired) -->
  <g opacity="0.65">
    <line x1="150" y1="-20" x2="310" y2="140" stroke="url(#ray1)" stroke-width="2" stroke-linecap="round">
      <animate attributeName="opacity" values="0;0.9;0" dur="3.6s" repeatCount="indefinite"/>
    </line>
    <line x1="310" y1="140" x2="260" y2="290" stroke="url(#ray1)" stroke-width="1.3" stroke-dasharray="4 4">
      <animate attributeName="opacity" values="0;0.75;0" dur="3.6s" begin="0.4s" repeatCount="indefinite"/>
    </line>
    <line x1="310" y1="140" x2="395" y2="300" stroke="url(#ray2)" stroke-width="1.5" stroke-dasharray="5 3">
      <animate attributeName="opacity" values="0;0.85;0" dur="3.6s" begin="0.4s" repeatCount="indefinite"/>
    </line>
    <circle cx="310" cy="140" r="3" fill="#38bdf8">
      <animate attributeName="r" values="1;6;1" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="3.6s" repeatCount="indefinite"/>
    </circle>

    <line x1="940" y1="-10" x2="1040" y2="120" stroke="url(#ray2)" stroke-width="2" stroke-linecap="round">
      <animate attributeName="opacity" values="0;0.9;0" dur="4.2s" begin="1.2s" repeatCount="indefinite"/>
    </line>
    <line x1="1040" y1="120" x2="985" y2="270" stroke="url(#ray1)" stroke-width="1.3" stroke-dasharray="4 4">
      <animate attributeName="opacity" values="0;0.7;0" dur="4.2s" begin="1.5s" repeatCount="indefinite"/>
    </line>
    <line x1="1040" y1="120" x2="1125" y2="265" stroke="url(#ray2)" stroke-width="1.4" stroke-dasharray="4 4">
      <animate attributeName="opacity" values="0;0.75;0" dur="4.2s" begin="1.5s" repeatCount="indefinite"/>
    </line>
    <circle cx="1040" cy="120" r="3" fill="#c084fc">
      <animate attributeName="r" values="1;6;1" dur="4.2s" begin="1.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="4.2s" begin="1.2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Top Pill Badge -->
  <g transform="translate(415, 34)">
    <rect width="370" height="30" rx="15" fill="#0f172a" stroke="#334155" stroke-width="1.2"/>
    <circle cx="20" cy="15" r="4.5" fill="#22c55e">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="195" y="19.5" fill="#94a3b8" font-family="'Fira Code', 'Consolas', monospace" font-size="11.5" font-weight="600" text-anchor="middle" letter-spacing="1.2">ACADEMIC PORTFOLIO &amp; PERSONAL LABS</text>
  </g>

  <!-- Main Title -->
  <text x="600" y="148" fill="url(#titleGrad)" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif" font-size="72" font-weight="900" text-anchor="middle" letter-spacing="6">STEIMBER</text>

  <!-- Subtitle -->
  <text x="600" y="190" fill="#e2e8f0" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif" font-size="20" font-weight="500" text-anchor="middle" letter-spacing="0.8">
    University Coursework · Scientific Simulations · Software Engineering
  </text>

  <!-- Animated Divider Line -->
  <rect x="250" y="214" width="700" height="2" fill="url(#accentLine)">
    <animate attributeName="x" values="200;300;200" dur="6s" repeatCount="indefinite"/>
  </rect>

  <!-- Feature Pills -->
  <g transform="translate(155, 244)" font-family="'Segoe UI', -apple-system, sans-serif" font-size="13" font-weight="600">
    <g transform="translate(0, 0)">
      <rect width="210" height="38" rx="10" fill="#0f172a" stroke="#0ea5e9" stroke-width="1.2" stroke-opacity="0.6"/>
      <text x="105" y="24" fill="#38bdf8" text-anchor="middle">🏛️ College_Projects Repo</text>
    </g>
    <g transform="translate(226, 0)">
      <rect width="215" height="38" rx="10" fill="#0f172a" stroke="#6366f1" stroke-width="1.2" stroke-opacity="0.6"/>
      <text x="107.5" y="24" fill="#818cf8" text-anchor="middle">⚛️ Physics &amp; Geant4 (C++)</text>
    </g>
    <g transform="translate(457, 0)">
      <rect width="210" height="38" rx="10" fill="#0f172a" stroke="#a855f7" stroke-width="1.2" stroke-opacity="0.6"/>
      <text x="105" y="24" fill="#c084fc" text-anchor="middle">🐳 Docker &amp; Linux Labs</text>
    </g>
    <g transform="translate(683, 0)">
      <rect width="205" height="38" rx="10" fill="#0f172a" stroke="#10b981" stroke-width="1.2" stroke-opacity="0.6"/>
      <text x="102.5" y="24" fill="#34d399" text-anchor="middle">🌐 ES / EN Bilingual Docs</text>
    </g>
  </g>
</svg>
