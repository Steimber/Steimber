<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 230" width="100%" height="100%">
  <defs>
    <linearGradient id="minBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1910"/>
      <stop offset="55%" stop-color="#141e15"/>
      <stop offset="100%" stop-color="#231710"/>
    </linearGradient>
    <linearGradient id="minBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="50%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b3613d"/>
    </linearGradient>
    <linearGradient id="crystalGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d97757"/>
      <stop offset="100%" stop-color="#9a4b2c"/>
    </linearGradient>
    <clipPath id="ecClip">
      <rect width="22" height="14" rx="2.5"/>
    </clipPath>
  </defs>

  <rect x="2" y="2" width="1176" height="226" rx="18" fill="url(#minBg)" stroke="url(#minBorder)" stroke-width="2.5"/>

  <!-- Left: Official Mineral Studio Crystal Logo Emblem -->
  <g transform="translate(42, 28)">
    <rect width="174" height="174" rx="24" fill="#f3f1ea" stroke="#d97706" stroke-width="2"/>
    <!-- 3 Terracotta Mineral Crystals -->
    <g transform="translate(87, 94)" fill="url(#crystalGrad)" stroke="#f3f1ea" stroke-width="3" stroke-linejoin="round">
      <!-- Left Crystal -->
      <polygon points="-46,-12 -26,-38 -4,-18 10,56 -24,58"/>
      <line x1="-26" y1="-38" x2="-10" y2="57" stroke="#f3f1ea" stroke-width="2.2"/>
      <!-- Center Tall Crystal -->
      <polygon points="-14,-44 10,-68 32,-44 26,58 -12,58"/>
      <line x1="10" y1="-68" x2="10" y2="58" stroke="#f3f1ea" stroke-width="2.4"/>
      <!-- Right Crystal -->
      <polygon points="28,-6 48,-24 58,-2 40,56 18,58"/>
      <line x1="48" y1="-24" x2="30" y2="57" stroke="#f3f1ea" stroke-width="2.2"/>
    </g>
  </g>

  <!-- Right Content -->
  <g transform="translate(248, 36)" font-family="'Segoe UI', -apple-system, sans-serif">
    <!-- Co-Founder Pill -->
    <rect x="0" y="0" width="235" height="28" rx="14" fill="#2e190f" stroke="#d97706" stroke-width="1.2"/>
    <text x="117.5" y="18.5" fill="#fdba74" font-size="11.5" font-weight="800" text-anchor="middle" letter-spacing="1">💎 CO-FOUNDER · SOFTWARE STUDIO</text>

    <!-- Ecuador Flag Pill -->
    <g transform="translate(248, 0)">
      <rect width="145" height="28" rx="14" fill="#0d2618" stroke="#22c55e" stroke-width="1.2"/>
      <g transform="translate(14, 7)" clip-path="url(#ecClip)">
        <rect x="0" y="0" width="22" height="7" fill="#FFD100"/>
        <rect x="0" y="7" width="22" height="3.5" fill="#0033A0"/>
        <rect x="0" y="10.5" width="22" height="3.5" fill="#EF3340"/>
      </g>
      <text x="86" y="18.5" fill="#86efac" font-size="11.5" font-weight="700" text-anchor="middle">Ecuador 🌲</text>
    </g>

    <!-- Title & Motto -->
    <text x="0" y="66" fill="#f8fafc" font-size="30" font-weight="900">Mineral Studio — <tspan fill="#fbbf24" font-style="italic">"Ideas that become systems."</tspan></text>

    <!-- Description -->
    <text x="0" y="98" fill="#cbd5e1" font-size="15">Independent software studio in Ecuador building tailored business systems: electronic invoicing (SRI),</text>
    <text x="0" y="120" fill="#cbd5e1" font-size="15">management platforms, booking engines, AI workflow automations, and custom web experiences.</text>

    <!-- Highlighted Links Bar -->
    <g transform="translate(0, 138)" font-size="13.5" font-weight="700">
      <rect x="0" y="0" width="270" height="36" rx="10" fill="#b3613d"/>
      <text x="135" y="23" fill="#ffffff" text-anchor="middle">🌐 Official Site: mineral-ec.com ↗</text>

      <rect x="286" y="0" width="320" height="36" rx="10" fill="#143321" stroke="#4ade80" stroke-width="1.4"/>
      <text x="446" y="23" fill="#86efac" text-anchor="middle">📸 Instagram: @mineralstudio.ec ↗</text>

      <text x="890" y="23" fill="#fde68a" text-anchor="end">🐻 Steimber · Co-Founder</text>
    </g>
  </g>
</svg>
