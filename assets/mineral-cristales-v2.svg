    <mask id="pieces">
      <use fill="#fff" href="#p0"/>
      <use fill="#fff" href="#p1"/>
      <use fill="#fff" href="#p2"/>
      <use fill="#fff" href="#p3"/>
      <use fill="#fff" href="#p4"/>
      <use fill="#fff" href="#p5"/>
      <use fill="#fff" href="#p6"/>
      <use fill="#fff" href="#p7"/>
    </mask>
  </defs>

  <style>
    .fill-crown { fill: url(#facetCrown); opacity: 0; animation: fade-in 0.55s ease forwards; }
    .fill-lit { fill: url(#facetLit); opacity: 0; animation: fade-in 0.55s ease forwards; }
    .fill-shadow { fill: url(#facetShadow); opacity: 0; animation: fade-in 0.55s ease forwards; }

    .line {
      fill: none;
      stroke: #f4b196;
      stroke-width: 2.2;
      stroke-linejoin: round;
      stroke-dasharray: 1;
      stroke-dashoffset: 1;
      animation-name: draw, edge-glow;
      animation-duration: 0.85s, 4s;
      animation-timing-function: cubic-bezier(0.65, 0, 0.35, 1), ease-in-out;
      animation-fill-mode: forwards, both;
      animation-iteration-count: 1, infinite;
    }

    .fill-p0 { animation-delay: 0.45s; }
    .line-p0 { animation-delay: 0.00s, 0.85s; }
    .fill-p1 { animation-delay: 0.60s; }
    .line-p1 { animation-delay: 0.15s, 1.00s; }
    .fill-p2 { animation-delay: 0.75s; }
    .line-p2 { animation-delay: 0.30s, 1.15s; }
    .fill-p3 { animation-delay: 0.90s; }
    .line-p3 { animation-delay: 0.45s, 1.30s; }
    .fill-p4 { animation-delay: 1.05s; }
    .line-p4 { animation-delay: 0.60s, 1.45s; }
    .fill-p5 { animation-delay: 1.20s; }
    .line-p5 { animation-delay: 0.75s, 1.60s; }
    .fill-p6 { animation-delay: 1.35s; }
    .line-p6 { animation-delay: 0.90s, 1.75s; }
    .fill-p7 { animation-delay: 1.50s; }
    .line-p7 { animation-delay: 1.05s, 1.90s; }

    .shine {
      opacity: 0;
      animation: shine-loop 5.5s ease-in-out 2.1s infinite;
    }

    .shard1 { animation: float-shard1 6s ease-in-out infinite; }
    .shard2 { animation: float-shard2 7.5s ease-in-out infinite -2.5s; }
    .shard3 { animation: float-shard1 5.2s ease-in-out infinite -4.1s; }

    @keyframes draw { to { stroke-dashoffset: 0; } }
    @keyframes fade-in { to { opacity: 1; } }
    @keyframes edge-glow {
      0%, 100% { stroke-opacity: 0.28; }
      50% { stroke-opacity: 0.72; }
    }
    @keyframes shine-loop {
      0% { opacity: 0; transform: translateX(-140px) skewX(-20deg); }
      12% { opacity: 0.95; }
      28% { opacity: 0; transform: translateX(560px) skewX(-20deg); }
      100% { opacity: 0; transform: translateX(560px) skewX(-20deg); }
    }
    @keyframes float-shard1 {
      0%, 100% { transform: translate(0px, 0px) rotate(-10deg); opacity: 0.45; }
      50% { transform: translate(4px, -16px) rotate(8deg); opacity: 0.85; }
    }
    @keyframes float-shard2 {
      0%, 100% { transform: translate(0px, 0px) rotate(14deg); opacity: 0.35; }
      50% { transform: translate(-5px, -18px) rotate(-6deg); opacity: 0.8; }
    }

    @media (prefers-reduced-motion: reduce) {
      .fill-crown, .fill-lit, .fill-shadow, .line, .shine, .shard1, .shard2, .shard3 { animation: none; }
      .fill-crown, .fill-lit, .fill-shadow { opacity: 1; }
      .line, .shine { display: none; }
    }
  </style>

  <g clip-path="url(#badgeClip)">
    <!-- Dark Obsidian Badge Background -->
    <rect x="70" y="58" width="374" height="396" rx="56" fill="url(#bgGrad)"/>
    <rect x="70" y="58" width="374" height="396" rx="56" fill="url(#coreGlow)"/>

    <!-- Subtle Crystalline Ridge at Bottom -->
    <path d="M 70 405 L 145 376 L 230 398 L 325 368 L 444 395 L 444 454 L 70 454 Z" fill="#120906" opacity="0.78"/>

    <!-- Floating Ambient Mineral Shards & Sparks -->
    <g transform="translate(116, 128) scale(1.25)"><g class="shard1"><use href="#miniShard"/></g></g>
    <g transform="translate(396, 152) scale(1.15)"><g class="shard2"><use href="#miniShard"/></g></g>
    <g transform="translate(178, 98) scale(0.9)"><g class="shard3"><use href="#miniShard"/></g></g>
    <circle cx="356" cy="108" r="3.5" fill="#fde68a" opacity="0.6">
      <animate attributeName="opacity" values="0.2;0.85;0.2" dur="3.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="106" cy="295" r="3" fill="#f4b196" opacity="0.5">
      <animate attributeName="opacity" values="0.15;0.75;0.15" dur="4.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="412" cy="245" r="3.5" fill="#fde68a" opacity="0.5">
      <animate attributeName="opacity" values="0.25;0.8;0.25" dur="3.8s" repeatCount="indefinite"/>
    </circle>

    <!-- 3D Faceted Crystal Cluster -->
    <use class="fill-crown fill-p0" href="#p0"/>
    <use class="line line-p0" href="#p0"/>

    <use class="fill-lit fill-p1" href="#p1"/>
    <use class="line line-p1" href="#p1"/>

    <use class="fill-shadow fill-p2" href="#p2"/>
    <use class="line line-p2" href="#p2"/>

    <use class="fill-lit fill-p3" href="#p3"/>
    <use class="line line-p3" href="#p3"/>

    <use class="fill-crown fill-p4" href="#p4"/>
    <use class="line line-p4" href="#p4"/>

    <use class="fill-shadow fill-p5" href="#p5"/>
    <use class="line line-p5" href="#p5"/>

    <use class="fill-lit fill-p6" href="#p6"/>
    <use class="line line-p6" href="#p6"/>

    <use class="fill-shadow fill-p7" href="#p7"/>
    <use class="line line-p7" href="#p7"/>

    <!-- Periodic Crystalline Shimmer Sweep -->
    <g mask="url(#pieces)">
      <rect width="75" height="436" x="70" y="38" fill="url(#shineGrad)" class="shine"/>
    </g>
  </g>

  <!-- Double Crystalline Frame Border (matches v2 cards) -->
  <rect x="73" y="61" width="368" height="390" rx="53" fill="none" stroke="url(#borderGrad)" stroke-width="5"/>
  <rect x="81" y="69" width="352" height="374" rx="46" fill="none" stroke="#fde68a" stroke-width="1.5" stroke-opacity="0.18"/>
</svg>
