<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="title" role="img" viewBox="70 58 374 396">
  <title id="title">Mineral Studio</title>
  <defs>
    <!-- Dark Obsidian & Terracotta Animated Background (matches cards & buttons) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d0806">
        <animate attributeName="stop-color" values="#0d0806;#160c08;#0a0605;#0d0806" dur="12s" repeatCount="indefinite"/>
      </stop>
      <stop offset="55%" stop-color="#1c100b">
        <animate attributeName="stop-color" values="#1c100b;#27150e;#140b08;#1c100b" dur="12s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#331a11">
        <animate attributeName="stop-color" values="#331a11;#452216;#24120c;#331a11" dur="12s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <!-- Pulsing Core Radial Glow Behind Crystals -->
    <radialGradient id="coreGlow" cx="50%" cy="54%" r="52%">
      <stop offset="0%" stop-color="#e08a6b" stop-opacity="0.38">
        <animate attributeName="stop-opacity" values="0.24;0.44;0.24" dur="5s" repeatCount="indefinite"/>
      </stop>
      <stop offset="55%" stop-color="#b3613d" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#0d0806" stop-opacity="0"/>
    </radialGradient>

    <!-- 3D Faceted Crystal Gradients -->
    <!-- Top Crown Facets (p0, p4) -->
    <linearGradient id="facetCrown" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f9ccb6"/>
      <stop offset="45%" stop-color="#e58d6b"/>
      <stop offset="100%" stop-color="#c46843"/>
    </linearGradient>

    <!-- Lit Left Facets (p1, p3, p6) -->
    <linearGradient id="facetLit" x1="0%" y1="0%" x2="30%" y2="100%">
      <stop offset="0%" stop-color="#e89574"/>
      <stop offset="45%" stop-color="#c96d47"/>
      <stop offset="100%" stop-color="#96492a"/>
    </linearGradient>

    <!-- Deep Shadowed Right Facets (p2, p5, p7) -->
    <linearGradient id="facetShadow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b85f3b"/>
      <stop offset="55%" stop-color="#8c4225"/>
      <stop offset="100%" stop-color="#5e2915"/>
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f4b196" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#b3613d" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#e08a6b" stop-opacity="0.75"/>
    </linearGradient>

    <!-- Shimmer Sweep Gradient -->
    <linearGradient id="shineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#fde68a" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <clipPath id="badgeClip">
      <rect x="70" y="58" width="374" height="396" rx="56"/>
    </clipPath>

    <!-- Mini Floating Crystal Shard -->
    <g id="miniShard">
      <polygon points="0,-10 -5,-3 -2,9 2,9 5,-3" fill="#e08a6b"/>
      <polygon points="0,-10 5,-3 2,9 0,9" fill="#9c4f2f"/>
      <polygon points="0,-10 -5,-3 0,-1 5,-3" fill="#fde68a" opacity="0.85"/>
    </g>

    <!-- Official Mineral Crystal Facet Paths -->
