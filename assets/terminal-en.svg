<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="100%" height="100%">
  <defs>
    <linearGradient id="termBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#06140c"/>
      <stop offset="100%" stop-color="#040b06"/>
    </linearGradient>
    <linearGradient id="headerBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0c2416"/>
      <stop offset="100%" stop-color="#133320"/>
    </linearGradient>
  </defs>

  <!-- Window Frame -->
  <rect width="1000" height="320" rx="14" fill="url(#termBg)" stroke="#1e462d" stroke-width="2"/>
  <path d="M 0 14 Q 0 0 14 0 L 986 0 Q 1000 0 1000 14 L 1000 42 L 0 42 Z" fill="url(#headerBg)"/>
  <line x1="0" y1="42" x2="1000" y2="42" stroke="#22c55e" stroke-width="1" stroke-opacity="0.4"/>

  <!-- Window Controls -->
  <circle cx="24" cy="21" r="6.5" fill="#ef4444"/>
  <circle cx="46" cy="21" r="6.5" fill="#f59e0b"/>
  <circle cx="68" cy="21" r="6.5" fill="#22c55e"/>
  <text x="500" y="26" fill="#86efac" font-family="'Fira Code', 'Consolas', monospace" font-size="13" font-weight="600" text-anchor="middle">🐻 steimber@utm-ecuador: ~/College_Projects 🌲 (zsh)</text>

  <!-- Terminal Body -->
  <g transform="translate(28, 72)" font-family="'Fira Code', 'Consolas', monospace" font-size="14">
    <!-- Prompt 1 -->
    <text x="0" y="0">
      <tspan fill="#4ade80" font-weight="700">➜</tspan>
      <tspan fill="#fbbf24" font-weight="700"> ~/College_Projects</tspan>
      <tspan fill="#34d399"> git:(</tspan><tspan fill="#fde047" font-weight="700">main</tspan><tspan fill="#34d399">)</tspan>
      <tspan fill="#dcfce7"> neofetch --profile &amp;&amp; tree -L 2</tspan>
    </text>

    <!-- Output -->
    <text x="0" y="28" fill="#fde68a" font-weight="700">🐻 User: <tspan fill="#dcfce7">Steimber</tspan> | 💎 Role: <tspan fill="#fdba74">Co-Founder @ Mineral Studio (mineral-ec.com)</tspan> | 🎓 Uni: <tspan fill="#86efac">UTM (Ecuador)</tspan></text>
    <text x="0" y="54" fill="#4ade80" font-weight="700">🌲 Steimber/College_Projects (Universidad Técnica de Manabí)</text>
    <text x="0" y="80" fill="#bbf7d0">├── 📂 <tspan fill="#4ade80" font-weight="700">proyecto-geant4/</tspan>           <tspan fill="#6ee7b7" opacity="0.7"># Cosmic Ray Atmospheric Shower Simulation (C++ / Geant4)</tspan></text>
    <text x="0" y="104" fill="#bbf7d0">│   ├── 🐳 <tspan fill="#dcfce7">Dockerfile</tspan>                 <tspan fill="#6ee7b7" opacity="0.7"># Reproducible container with Geant4 + X11 GUI</tspan></text>
    <text x="0" y="128" fill="#bbf7d0">│   ├── ⚙️ <tspan fill="#dcfce7">geant4make.sh</tspan>              <tspan fill="#6ee7b7" opacity="0.7"># Automated CMake build script</tspan></text>
    <text x="0" y="152" fill="#bbf7d0">│   └── ⚛️ <tspan fill="#fde047" font-weight="700">proyecto_lluvias_cosmicas/</tspan> <tspan fill="#6ee7b7" opacity="0.7"># Sensitive detector, physics list &amp; primary generator</tspan></text>
    <text x="0" y="176" fill="#bbf7d0">├── 📄 <tspan fill="#86efac">README.md</tspan>                      <tspan fill="#6ee7b7" opacity="0.7"># Spanish university coursework index</tspan></text>
    <text x="0" y="200" fill="#bbf7d0">└── 📄 <tspan fill="#86efac">README.en.md</tspan>                   <tspan fill="#6ee7b7" opacity="0.7"># English university coursework index</tspan></text>

    <!-- Prompt 2 with blinking cursor -->
    <text x="0" y="230">
      <tspan fill="#4ade80" font-weight="700">➜</tspan>
      <tspan fill="#fbbf24" font-weight="700"> ~/College_Projects</tspan>
      <tspan fill="#34d399"> git:(</tspan><tspan fill="#fde047" font-weight="700">main</tspan><tspan fill="#34d399">)</tspan>
      <tspan fill="#86efac"> ./run_simulation --beamOn 10 </tspan>
    </text>
    <rect x="492" y="216" width="9" height="17" fill="#4ade80">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
